[project]
name = "tp3-dsd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
]

[project.scripts]
tp3-dsd = "tp3_dsd:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

